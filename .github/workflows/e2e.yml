name: E2E – Veiligheid overflow & iOS Safari checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# Avoid stacking redundant runs on the same ref.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (Chromium + WebKit/iOS Safari)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Lovable beheert bun.lockb; npm ci zou struikelen over een
      # verouderde package-lock.json.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Install only the browsers we actually use (Chromium + WebKit).
      # WebKit op Linux is exact dezelfde engine die iOS Safari gebruikt.
      - name: Install Playwright browsers (chromium, webkit)
        run: bunx playwright install --with-deps chromium webkit

      - name: Run Playwright tests
        env:
          CI: "true"
        run: bunx playwright test

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Upload overflow report (md + json + screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veiligheid-overflow-report
          path: test-results/veiligheid-overflow
          retention-days: 30

      - name: Upload anchor-offset report (md + json)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veiligheid-anchor-offset-report
          path: test-results/veiligheid-anchor-offset
          retention-days: 30

      - name: Upload visual-regression snapshot diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          path: |
            test-results/**/visual-regression-*
            e2e/visual-regression.spec.ts-snapshots
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload raw test-results (traces, videos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          retention-days: 7
